[pytest]
testpaths = tests
pythonpath = .
addopts =
    --strict-markers
    --strict-config
    -ra
markers =
    allow_httpx: test may construct a real httpx.Client (FastAPI's TestClient runs over an in-process ASGI transport, not the network).
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:main
