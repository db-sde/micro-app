name: CI

# Runs on every push and pull request. Pushes to main are what Render and
# Vercel auto-deploy from, so a red run here is the signal that a deploy
# went out (or is about to) with a known problem.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ── Backend: lint, tests, and a real import of the ASGI app ───────────
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Run tests
        # No secrets are provided on purpose: the suite must never depend on
        # a live WordPress/Cloudinary/OpenAI credential, and conftest blocks
        # un-mocked network calls so an accidental one fails loudly here
        # rather than silently publishing to the production site.
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml

      - name: Verify the ASGI app imports and routes are registered
        # Catches an import-time break (bad module-level code, circular
        # import, missing dependency) that unit tests alone could miss.
        run: |
          python -c "
          import main
          routes = [r.path for r in main.app.routes]
          assert '/health' in routes, 'health route missing'
          assert '/upload' in routes, 'upload route missing'
          print(f'OK - {len(routes)} routes registered')
          "

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ── Frontend: the build Vercel will run ──────────────────────────────
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test catalog UI helpers
        run: npm test

      - name: Build
        # Same command Vercel runs. A build error here is a deploy that
        # would have failed in production.
        run: npm run build

      - name: Check the build produced output
        run: test -d dist && test -n "$(ls -A dist)"

  # ── Repository hygiene ───────────────────────────────────────────────
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        # backend/.env holds live WordPress and Cloudinary credentials.
        # Only the .example templates belong in git.
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "::error::An environment file is tracked in git. Remove it and rotate the credentials."
            exit 1
          fi
          echo "OK - no env files tracked"

      - name: No committed build artefacts
        run: |
          if git ls-files | grep -E '__pycache__|\.pyc$|(^|/)node_modules/'; then
            echo "::error::Build artefacts are tracked in git."
            exit 1
          fi
          echo "OK - no build artefacts tracked"

      - name: Dependency manifests are in sync
        # An import added without a matching requirements entry installs
        # fine locally (already in the dev venv) and then breaks on Render.
        run: |
          test -f backend/requirements.txt
          test -f backend/requirements-dev.txt
          grep -q '^-r requirements.txt' backend/requirements-dev.txt \
            || { echo "::error::requirements-dev.txt must include the runtime requirements"; exit 1; }
          echo "OK - manifests present and linked"

  # ── Aggregate gate: one required check for branch protection ─────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend, hygiene]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
